<div class="min-h-screen bg-surface-bg flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm">
        <div class="mb-5 text-center">
            <img src="/logo-icon.png" alt="ThaStore logo" class="mx-auto mb-3 h-14 w-14 rounded-full object-cover shadow-md" />
            <h1 class="text-2xl font-semibold text-gray-900">Sign in</h1>
        </div>

        <!-- came from a scanned label: only the code is shown before signing in, the laptop opens after -->
        <div *ngIf="scannedCode" data-scanned class="mb-4 flex items-center gap-3 rounded-xl border border-surface-border bg-white px-4 py-3">
            <svg class="h-6 w-6 flex-shrink-0 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 14h3v3M21 14v1M14 21h1M17 21h4v-3"/></svg>
            <div class="min-w-0">
                <p class="text-xs text-gray-500">You scanned</p>
                <p class="font-mono text-base font-bold text-gray-900">{{ scannedCode }}</p>
            </div>
        </div>

        <div class="rounded-xl border border-surface-border bg-white p-6 shadow-card">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div *ngIf="errorMessage" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">
                    {{ errorMessage }}
                </div>

                <div class="mb-4">
                    <label for="email" class="mb-2 block text-sm font-medium text-gray-700">
                        Email
                    </label>
                    <input id="email" type="email" formControlName="email"
                        class="w-full rounded-lg border border-surface-border px-4 py-2.5 transition focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100"
                        [class.border-red-400]="emailControl.invalid && emailControl.touched" placeholder="Email">
                    <div *ngIf="emailControl.invalid && emailControl.touched" class="text-red-500 text-xs mt-1">
                        <p *ngIf="emailControl.errors?.['required']">Email is required</p>
                        <p *ngIf="emailControl.errors?.['email']">Please enter a valid email</p>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="password" class="mb-2 block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <input id="password" type="password" formControlName="password"
                        class="w-full rounded-lg border border-surface-border px-4 py-2.5 transition focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100"
                        [class.border-red-400]="passwordControl.invalid && passwordControl.touched" placeholder="Password">
                    <div *ngIf="passwordControl.invalid && passwordControl.touched" class="text-red-500 text-xs mt-1">
                        <p *ngIf="passwordControl.errors?.['required']">Password is required</p>
                        <p *ngIf="passwordControl.errors?.['minlength']">Password must be at least 6 characters</p>
                    </div>
                </div>

                <button type="submit" [disabled]="isLoading"
                    class="w-full rounded-lg bg-primary-500 px-4 py-3 font-medium text-white transition hover:bg-primary-600 disabled:cursor-not-allowed disabled:opacity-50">
                    <span *ngIf="!isLoading">Sign In</span>
                    <span *ngIf="isLoading">Signing in...</span>
                </button>
            </form>
        </div>
    </div>
</div>

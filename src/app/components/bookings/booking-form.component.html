<form (ngSubmit)="submit()" (keydown.meta.enter)="submit()" (keydown.control.enter)="submit()" novalidate class="flex min-h-0 flex-1 flex-col">
  <div class="flex-1 space-y-5 overflow-y-auto p-5">

    <!-- Product: type to find one of your products, or write anything -->
    <div>
      <label for="b-product" class="mb-1 block text-xs font-medium text-gray-700">Product <span class="text-red-500">*</span></label>
      <app-product-search inputId="b-product" name="product_name" [text]="form.product_name" [products]="products" [hideHeld]="true"
        placeholder="e.g. MacBook Air M5 | RAM 16GB | SSD 512GB" (textChange)="onProductText($event)" (picked)="pickProduct($event)"></app-product-search>

      <!-- Only when this laptop cannot be booked (someone else has it set aside) -->
      <p *ngIf="holdBlockedNote" class="mt-1 text-xs text-red-600" data-hold-note>{{ holdBlockedNote }}</p>
      <div *ngIf="priceOptions.length > 1" class="mt-2 flex flex-wrap gap-1.5" role="group" aria-label="Prices of this product">
        <button *ngFor="let option of priceOptions" type="button" (click)="chooseOption(option)"
          class="rounded-md border px-2 py-1 text-xs transition"
          [ngClass]="option.name === form.product_name && option.price === form.full_price
            ? 'border-primary-500 bg-primary-50 font-medium text-primary-700'
            : 'border-surface-border bg-white text-gray-600 hover:bg-gray-50'">
          {{ option.label }} · {{ money(option.price) }}
        </button>
      </div>
    </div>

    <!-- Contact -->
    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label for="b-phone" class="mb-1 block text-xs font-medium text-gray-700">Phone <span class="text-red-500">*</span></label>
        <input id="b-phone" type="tel" name="phone" [(ngModel)]="form.phone" inputmode="tel" autocomplete="off" maxlength="20" placeholder="011 968 240"
          class="w-full rounded-lg border border-surface-border px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
      </div>
      <div>
        <label for="b-telegram" class="mb-1 block text-xs font-medium text-gray-700">Telegram <span class="text-red-500">*</span></label>
        <input id="b-telegram" type="text" name="telegram" [(ngModel)]="form.telegram" autocomplete="off" autocapitalize="off" maxlength="60" placeholder="@username"
          class="w-full rounded-lg border border-surface-border px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
      </div>
    </div>

    <!-- Money -->
    <div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="b-price" class="mb-1 block text-xs font-medium text-gray-700">Full price <span class="text-red-500">*</span></label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">$</span>
            <input id="b-price" type="number" name="full_price" [(ngModel)]="form.full_price" (input)="onPriceInput()" min="0" step="0.01" inputmode="decimal" placeholder="0.00"
              class="w-full rounded-lg border border-surface-border py-2 pl-7 pr-3 text-sm tabular-nums focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
          </div>
        </div>
        <div>
          <label for="b-deposit" class="mb-1 block text-xs font-medium text-gray-700">Deposit</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">$</span>
            <input id="b-deposit" type="number" name="deposit" [(ngModel)]="form.deposit" min="0" step="0.01" inputmode="decimal" placeholder="0.00"
              class="w-full rounded-lg border border-surface-border py-2 pl-7 pr-3 text-sm tabular-nums focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
          </div>
        </div>
      </div>
      <p class="mt-2 flex items-center justify-between rounded-lg px-3 py-2 text-sm" aria-live="polite"
        [ngClass]="depositTooBig ? 'bg-red-50 text-red-700' : 'bg-gray-50 text-gray-700'">
        <span>Remaining balance</span>
        <span class="font-semibold tabular-nums">{{ depositTooBig ? 'Deposit is more than the price' : money(remaining) }}</span>
      </p>
    </div>

    <!-- Dates -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label for="b-booked" class="mb-1 block text-xs font-medium text-gray-700">Booking date <span class="text-red-500">*</span></label>
        <input id="b-booked" type="date" name="booking_date" [(ngModel)]="form.booking_date"
          class="w-full rounded-lg border border-surface-border px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        <p class="mt-1 min-h-[1rem] text-[11px] text-gray-500">{{ dateLabel(form.booking_date) }}</p>
      </div>
      <div>
        <label for="b-pickup" class="mb-1 block text-xs font-medium text-gray-700">Pickup date <span class="text-red-500">*</span></label>
        <input id="b-pickup" type="date" name="pickup_date" [(ngModel)]="form.pickup_date" [attr.min]="form.booking_date || null"
          class="w-full rounded-lg border border-surface-border px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        <p class="mt-1 min-h-[1rem] text-[11px] text-gray-500">{{ dateLabel(form.pickup_date) }}</p>
      </div>
    </div>

    <!-- Photos: the laptop's own photo comes first (it goes to Telegram first); more can be added, e.g. the deposit receipt -->
    <app-photo-upload [(photos)]="form.images" [lead]="laptopPhoto" [max]="maxPhotos" label="Photos (e.g. deposit receipt)"
      (uploadingChange)="uploading = $event"></app-photo-upload>

    <!-- Status -->
    <div>
      <label for="b-status" class="mb-1 block text-xs font-medium text-gray-700">Status</label>
      <select id="b-status" name="status" [(ngModel)]="form.status"
        class="w-full rounded-lg border border-surface-border bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100">
        <option *ngFor="let status of statuses" [ngValue]="status.value">{{ status.label }}</option>
      </select>
    </div>
  </div>

  <!-- Footer: the message is here (not at the top) so it is always in view -->
  <div class="flex-shrink-0 border-t border-surface-border bg-white px-5 py-3">
    <p *ngIf="formError" role="alert" class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">{{ formError }}</p>
    <div class="flex justify-end gap-2">
      <button type="button" (click)="cancel()" [disabled]="isSubmitting"
        class="rounded-lg border border-surface-border px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50">Cancel</button>
      <button type="submit" [disabled]="isSubmitting || uploading"
        class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-60">
        {{ isSubmitting ? 'Saving...' : (uploading ? 'Uploading...' : (booking ? 'Save changes' : 'Save booking')) }}
      </button>
    </div>
  </div>
</form>

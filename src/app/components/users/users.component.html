<div class="space-y-5">
  <app-page-header title="Users" description="">
    <button type="button" (click)="openAdd()" data-action="add"
      class="inline-flex items-center gap-1.5 rounded-lg bg-primary-600 px-3.5 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
      Add member
    </button>
  </app-page-header>

  <!-- Error -->
  <div *ngIf="errorMessage" role="alert" class="flex items-start justify-between gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
    <span>{{ errorMessage }}</span>
    <button type="button" (click)="errorMessage = ''" class="text-red-400 hover:text-red-600" aria-label="Dismiss">✕</button>
  </div>

  <!-- Done -->
  <div *ngIf="successMessage" role="status" class="flex items-center gap-2 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
    <span>{{ successMessage }}</span>
  </div>

  <app-skeleton *ngIf="isLoading" kind="users" [count]="4"></app-skeleton>

  <!-- One card each, two per row on a wide screen. On a phone the button is on its own row, so the name and email fit. -->
  <div *ngIf="!isLoading && users.length > 0" class="grid grid-cols-1 gap-4 xl:grid-cols-2">
    <article *ngFor="let user of users" data-user
      class="flex flex-wrap items-center gap-3 rounded-xl border border-gray-100 bg-white p-4 shadow-sm">
      <div class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full bg-primary-100 text-base font-semibold text-primary-700" aria-hidden="true">
        {{ nameOf(user).charAt(0).toUpperCase() }}
      </div>
      <div class="min-w-0 flex-1">
        <p class="flex items-center gap-2">
          <span class="truncate font-semibold text-gray-900" data-name>{{ nameOf(user) }}</span>
          <span *ngIf="isMe(user)" class="flex-shrink-0 rounded bg-gray-100 px-1.5 py-0.5 text-[10px] font-medium text-gray-600" data-me>You</span>
        </p>
        <p class="truncate text-sm text-gray-500" data-email>{{ user.email }}</p>
        <div class="mt-1.5"><app-status-badge [tone]="user.role === 'admin' ? 'info' : 'neutral'">{{ user.role === 'admin' ? 'Admin' : 'Staff' }}</app-status-badge></div>
      </div>
      <button type="button" (click)="openReset(user)" data-action="reset"
        class="w-full flex-shrink-0 rounded-lg border border-surface-border bg-white px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 sm:w-auto focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
        Reset password
      </button>
    </article>
  </div>

  <div *ngIf="!isLoading && !errorMessage && users.length === 0" class="rounded-lg border border-surface-border bg-white px-4 py-12 text-center shadow-card">
    <p class="text-base font-medium text-gray-700">No users found.</p>
  </div>
</div>

<!-- ============ Add member: a panel that slides in from the right edge (the form is <app-member-form>) ============ -->
<div *ngIf="adding" class="drawer-backdrop fixed inset-0 z-50 flex justify-end bg-gray-900/50" (click)="closeAdd()">
  <div class="drawer-panel flex h-full w-full max-w-lg flex-col bg-white shadow-2xl" role="dialog" aria-modal="true" aria-label="Add member"
       (click)="$event.stopPropagation()">

    <div class="flex flex-shrink-0 items-center justify-between border-b border-surface-border px-5 py-4">
      <div class="min-w-0">
        <h2 class="text-base font-semibold text-gray-900">Add member</h2>
        <p class="text-xs text-gray-400">They sign in with their email and the password you write.</p>
      </div>
      <button type="button" (click)="closeAdd()" class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600" aria-label="Close">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <app-member-form (saved)="onAdded($event)" (cancelled)="closeAdd()"></app-member-form>
  </div>
</div>

<!-- ============ Reset password: the same question box as everywhere, with the new password inside ============ -->
<app-ask-dialog *ngIf="resetting as person" title="Reset password"
  [message]="'Write a new password for ' + nameOf(person) + '.'"
  [detail]="isMe(person) ? 'This is you. You stay signed in.' : 'They will be signed out and have to sign in again.'"
  yesLabel="Change password" noLabel="Cancel" focus="content" [busy]="isResetting" [error]="resetError"
  (yes)="confirmReset()" (no)="cancelReset()">
  <div class="mt-3">
    <label for="new-password" class="mb-1 block text-xs font-medium text-gray-700">New password</label>
    <input id="new-password" type="text" name="new-password" [(ngModel)]="newPassword" maxlength="72" autocomplete="off" autocapitalize="off" spellcheck="false"
      [placeholder]="'At least ' + minPassword + ' characters'" (keydown.enter)="confirmReset()"
      class="w-full rounded-lg border border-surface-border px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
  </div>
</app-ask-dialog>

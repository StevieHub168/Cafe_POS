<app-sidebar
  *ngIf="currentUser$ | async as user"
  [user]="user"
  [open]="sidebarOpen"
  (close)="closeSidebar()"
  (navigate)="closeSidebar()"
  (logout)="logout()"
></app-sidebar>

<div
  class="min-h-screen bg-surface-bg"
  [ngClass]="!isAuthPage() && (currentUser$ | async) ? 'lg:pl-64' : ''"
>
  <app-header
    *ngIf="currentUser$ | async as user"
    [user]="user"
    [pageTitle]="pageTitle"
    [isAdmin]="isAdmin()"
    (toggleSidebar)="toggleSidebar()"
  ></app-header>

  <main [class]="isAuthPage() ? 'p-0' : 'p-4 lg:p-6'">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- How each message to Telegram went (Sending / Sent / Not sent) -->
<app-telegram-toasts></app-telegram-toasts>
